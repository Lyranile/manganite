# Umbriel outputs configuration
# Split from config.toml

[output.DP-2]
mode = "2560x1440@144"
position = [0, 0]
transform = "90"
scale = 1.25
vrr = "disabled"
hdr = "auto"
focus_at_startup = true
workspace_axis = "vertical"
# sdr_transfer = "gamma22" # Or "srgb" for piecewise SDR decoding in HDR.

[output.DP-3]
mode = "3440x1440@144"
position = [1280, 0]
# transform = "90"
scale = 1.25
vrr = "disabled"
hdr = "auto"
focus_at_startup = false
workspace_axis = "horizontal"
# sdr_transfer = "gamma22" # Or "srgb" for piecewise SDR decoding in HDR.

# ==============================================================================
# Appearance
# Blur uses a smaller radius than the built-in default.
# https://docs.noctalia.dev/umbriel/appearance/
#
