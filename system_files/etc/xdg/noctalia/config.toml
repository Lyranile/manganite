[bar.default]
shadow = false
contact_shadow = false

[dock]
enabled = true
shadow = false

[shell]
time_format = "{:%H:%M:%S}"
date_format = "%d/%m/%y"

[shell.panel]
shadow = false

[theme]
mode = "dark"
source = "builtin"
builtin = "Tokyo-Night"

[wallpaper]
default.path = "/usr/share/icons/hicolor/scalable/apps/background.svg"
fill_mode = "crop"
