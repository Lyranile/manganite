[customizations.installer.kickstart]
contents = '''
%post
# Ensure zsh is the default shell for all installer-created users (Anaconda
# may not honor /etc/default/useradd SHELL, so set it explicitly here).
for u in $(awk -F: '$3 >= 1000 {print $1}' /etc/passwd); do
  sed -i "s|^\($u:[^:]*:[^:]*:[^:]*:[^:]*:[^:]*:\).*|\1/usr/bin/zsh|" /etc/passwd
done
sed -i "s|^\(root:[^:]*:[^:]*:[^:]*:[^:]*:[^:]*:\).*|\1/usr/bin/zsh|" /etc/passwd
bootc switch --mutate-in-place --transport registry ghcr.io/lyranile/manganite:latest
%end
'''

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone",
]

disable = ["org.fedoraproject.Anaconda.Modules.Subscription"]

[customizations.iso]
volume_id = "Manganite"
application_id = "manganite"
publisher = "lyranile"
