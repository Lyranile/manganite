name: Build Live ISOs

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Upload ISOs as job artifacts'
        type: boolean
        default: true
  pull_request:
    branches:
      - main
    paths:
      - 'iso/**'
      - '.github/workflows/build-live-iso.yml'

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_NAME: "manganite"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Live ISO
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v7

      - name: Pull base image
        env:
          IMAGE_REF: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -eoux pipefail
          sudo podman pull "${IMAGE_REF}:latest"

      - name: Build Live Container Image
        id: build-container
        env:
          IMAGE_REF: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -eoux pipefail
          CONTAINER_IMAGE_NAME="manganite-live:latest"
          sudo podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE=${IMAGE_REF}:latest \
            --tag "${CONTAINER_IMAGE_NAME}" \
            -f iso/Containerfile \
            .
          echo "image_name=${CONTAINER_IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Build ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: ${{ steps.build-container.outputs.image_name }}

      - name: Rename ISO
        id: rename
        env:
          OUTPUT_PATH: ${{ steps.build.outputs.iso-dest }}
        run: |
          set -x
          mkdir -p output
          OUTPUT_DIRECTORY="$(realpath output)"
          mv "${OUTPUT_PATH}" "${OUTPUT_DIRECTORY}/manganite-live.iso"
          (cd "${OUTPUT_DIRECTORY}" && sha256sum "manganite-live.iso" | tee "manganite-live.iso-CHECKSUM")
          echo "output_directory=$OUTPUT_DIRECTORY" >> "${GITHUB_OUTPUT}"

      - name: Upload ISO to Job Artifacts
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          if-no-files-found: error
          path: ${{ steps.rename.outputs.output_directory }}/manganite-live.iso
          archive: false

      - name: Upload Checksum to Job Artifacts
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          if-no-files-found: error
          path: ${{ steps.rename.outputs.output_directory }}/manganite-live.iso-CHECKSUM
          archive: false
