name: Bug report
description: Report a problem with the manganite image
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and what you expected instead.
    validations:
      required: true
  - type: input
    id: image-name
    attributes:
      label: Image and tag
      description: Which image/tag are you running (e.g. ghcr.io/lyranile/manganite:latest)?
      placeholder: "ghcr.io/lyranile/manganite:latest"
    validations:
      required: true
  - type: textarea
    id: system-info
    attributes:
      label: System information
      description: Run `rpm-ostree status` and paste the output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Any logs or commands that help reproduce the problem.
