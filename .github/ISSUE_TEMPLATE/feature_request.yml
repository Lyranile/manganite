name: Feature request
description: Suggest a change to the manganite image
labels: [enhancement]
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like to change?
      description: Describe the feature, package, or tweak you'd like to see.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why?
      description: What problem does this solve for you?
