# Mango config for manganite (Noctalia)
# Docs: https://mangowm.github.io/docs/configuration

# Environment
env=QT_QPA_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_QPA_PLATFORMTHEME_QT6,gtk3

# Keyboard
repeat_rate=40
repeat_delay=300
numlockon=1
xkb_rules_layout=us
# xkb_rules_variant=
# xkb_rules_options=caps:escape

# Mouse
mouse_natural_scrolling=0
mouse_accel_profile=2
mouse_accel_speed=0.0
left_handed=0

# Trackpad
tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=0
disable_while_typing=1
drag_lock=1
middle_button_emulation=0

# Theming
# Colors are 0xRRGGBBAA
rootcolor=0x16161eff
bordercolor=0x2a2a3aff
focuscolor=0x9e9effff
urgentcolor=0xad401fff
dropcolor=0x9e9eff55

borderpx=1
gappih=5
gappiv=5
gappoh=10
gappov=10

cursor_size=24
cursor_theme=Adwaita

# Window behavior
focus_on_activate=1
sloppyfocus=1
warpcursor=1
focus_cross_monitor=1
focus_cross_tag=0
view_current_to_back=1
enable_floating_snap=1
snap_distance=30
no_border_when_single=1
tag_carousel=1
drag_tile_to_tile=1
drag_corner=4
xwayland_persistence=1
syncobj_enable=1

# Layer rules
layerrule=noanim:1,noblur:1,layer_name:selection

# Window rules
windowrule=isnoborder:1,appid:^foot$
windowrule=isnoborder:1,appid:^org.wezfurlong.wezterm$
windowrule=isnoborder:1,appid:^Alacritty$
windowrule=isnoborder:1,appid:^com.mitchellh.ghostty$
windowrule=isnoborder:1,appid:^kitty$
windowrule=isnoborder:1,appid:^org.gnome.

# Keybindings
# Window management
bind=SUPER,Return,spawn,foot
bind=SUPER,Q,killclient
bind=SUPER,F,togglefloating
bind=SUPER+SHIFT,F,togglefullscreen
bind=SUPER+SHIFT,Space,switch_layout
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev
bind=SUPER,Left,focus_window_or_workspace,left
bind=SUPER,Right,focus_window_or_workspace,right
bind=SUPER,Up,focus_window_or_workspace,up
bind=SUPER,Down,focus_window_or_workspace,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER,R,reload_config

# Tags
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,0
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,toggletag,0

# Media keys via Noctalia IPC
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# Noctalia launcher and panels
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle

# Blur and shadows for Noctalia layer-shell
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0
layer_animations=0
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadowscolor=0x000000ff

# Autostart
exec-once=dbus-update-activation-environment --systemd --all
exec-once=systemctl --user start mango-session.target
exec-once=noctalia
exec-once=foot
