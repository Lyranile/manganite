# Mango config
# Docs: https://mangowm.github.io/docs/configuration

# Renderer
env=WLR_RENDERER,vulkan

# Environment
env=QT_QPA_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# Monitors
monitor_rule=name:^DP-1$,width:3440,height:1440,refresh:144,x:0,y:0,scale:1,vrr:1,rr:0
monitor_rule=name:^DP-2$,width:2560,height:1440,refresh:165,x:3440,y:0,scale:1,vrr:1,rr:1
# monitor_rule=name:^HDMI-.*$,width:2560,height:1440,refresh:120,x:0,y:1440,scale:1,vrr:1,rr:0

# Input
repeat_rate=40
repeat_delay=300
numlockon=1
xkb_rules_layout=us
mouse_natural_scrolling=0
mouse_accel_profile=0
mouse_accel_speed=0.0
tap_to_click=1
trackpad_natural_scrolling=0
trackpad_accel_profile=0
trackpad_accel_speed=0.0

# Window management
focus_on_activate=1
sloppyfocus=1

# Keybindings
bind=SUPER,Return,spawn,foot
bind=SUPER,Q,killclient
bind=SUPER,F,togglefloating
bind=SUPER+SHIFT,F,togglefullscreen
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER,R,reload_config

# Tags
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# Media keys
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# DMS launcher / panels
bind=SUPER,space,spawn,dms ipc call spotlight toggle
bind=SUPER,s,spawn,dms ipc call control-center toggle

# Overview on Super key release
bindr=Super,Super_L,toggleoverview

# Mouse: move/resize windows
bindm=SUPER,btn_left,movewindow
bindm=SUPER,btn_right,resizewindow

# Autostart
exec-once=dbus-update-activation-environment --systemd --all
exec-once=systemctl --user start mango-session.target
