label: "Manganite-Live"
grub2:
  timeout: 3
  entries:
    - name: "Launch Manganite Installer"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Manganite-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Launch Manganite Installer (Basic Graphics Mode)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Manganite-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
